[package]
name = "competency-tracker"
version = "1.4.0"
edition = "2021"

[lib]
name = "competency_tracker"
path = "src/lib.rs"

[[bin]]
name = "competency-tracker"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding (not "abort"): a panic while starting one graphics mode must be
# caught so the next mode can be tried, and reported instead of vanishing.
panic = "unwind"

[dependencies]
calamine = "=0.38.0"
chrono = { version = "=0.4.45", features = ["serde"] }
eframe = { version = "=0.36.2", features = ["wgpu", "glow"] }
egui = "=0.36.2"
egui-phosphor = "=0.14.0"
fuzzy-matcher = "=0.3.7"
log = "=0.4.35"
nanoid = "=0.5.0"
quick-xml = "=0.42.0"
rfd = "=0.18.0"
rust_xlsxwriter = "=0.102.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_WindowsProgramming", "Win32_System_Com_Urlmon"] }
zip = { version = "=9.5.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = "=0.36.2"
tempfile = "=3.27.0"

[build-dependencies]
winresource = "=0.1.34"





